name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # No se descarga el modelo ni se procesa video: los tests no lo necesitan.
      - name: Instalar el paquete
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -v
