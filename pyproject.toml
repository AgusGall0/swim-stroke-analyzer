[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swimalyzer"
version = "0.1.0"
description = "Análisis biomecánico de la brazada de crol a partir de video"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Agustín Gallo" }]
requires-python = ">=3.11"
# Versiones pinneadas: no se actualizan sin pedirlo (ver CLAUDE.md).
# opencv-contrib-python y no opencv-python: mediapipe ya depende de él y los
# dos paquetes escriben el mismo módulo cv2.
dependencies = [
    "mediapipe==1.0.1",
    "opencv-contrib-python==4.14.0.94",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "matplotlib==3.11.2",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[project.scripts]
swimalyzer = "swimalyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Los scripts originales son registro del proceso y se conservan tal cual.
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
