# Configuración del pipeline de swimalyzer.
#
# Todos los parámetros son obligatorios: si falta una clave, la carga falla.
# Los que están en `null` son DECISIONES ABIERTAS (ver CLAUDE.md): todavía no
# tienen un valor justificado con evidencia. Se dejan en null a propósito para
# que ningún número provisorio termine en una figura. La etapa que los necesite
# se niega a correr hasta que se completen.
#
# Los valores de `calidad`, `filtrado` y `lateralidad` salieron del informe de
# caracterización de la señal (`scripts/caracterizar_senal.py`) sobre el video
# de desarrollo; el comentario de cada uno dice de dónde.
#
# Las rutas relativas se resuelven respecto de la carpeta de este archivo.

modelo:
  # URL del modelo Pose Landmarker (variante heavy, float16). Se usa la ruta con
  # versión (/1/) y no /latest/, que puede cambiar sin aviso.
  url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task
  # SHA-256 esperado del archivo. Google no lo publica: se calculó sobre la
  # descarga del 2026-09-15 y se verificó contra el MD5 que expone el bucket
  # (header x-goog-hash). Se registra en la metadata de cada corrida.
  sha256: 64437af838a65d18e5ba7a0d39b465540069bc8aae8308de3e318aad31fcbc7b
  # Dónde queda el modelo descargado. La carpeta está ignorada por git.
  ruta: modelos/pose_landmarker_heavy.task

deteccion:
  # Parámetros de PoseLandmarkerOptions. Los valores son los que MediaPipe
  # 1.0.1 usa por defecto; se explicitan para que queden en la metadata. No
  # fueron ajustados para este video.
  #
  # Cantidad máxima de personas a detectar por fotograma. Varios nadadores
  # simultáneos está fuera de alcance.
  num_poses: 1
  # Confianza mínima del detector de persona para aceptar una detección.
  min_pose_detection_confidence: 0.5
  # Confianza mínima de que la pose sigue presente en el fotograma.
  min_pose_presence_confidence: 0.5
  # Confianza mínima para seguir la pose entre fotogramas en lugar de volver a
  # correr el detector.
  min_tracking_confidence: 0.5

video:
  # Recorte aplicado a cada fotograma antes de la inferencia, en píxeles del
  # video original: {x, y, ancho, alto}, con (x, y) la esquina superior
  # izquierda. null = sin recorte. Se puede sobrescribir desde el CLI con
  # --recorte X Y ANCHO ALTO.
  recorte: null

calidad:
  # Umbral de visibility (0 a 1) por debajo del cual una medición se considera
  # poco confiable. Es criterio de REPORTE, no de descarte: la etapa de métricas
  # lo usa para marcar mediciones dudosas e informar cobertura por landmark, y
  # nunca para borrar filas. El filtrado no mira este valor.
  #
  # 0.3: un umbral global no elige qué fotogramas son malos, elige qué miembros
  # existen, porque en vista lateral visibility discrimina lado cercano de lado
  # lejano; borrar esas mediciones destruiría el resultado principal, que es
  # cuantificar cuán poco confiable es el lado lejano.
  umbral_visibility_reporte: 0.3

filtrado:
  # Filtro paso bajo aplicado a las trayectorias, en píxeles, tramo continuo por
  # tramo continuo. Sin gate por visibility: se filtra todo lo detectado.
  #
  # Butterworth de orden 2 con filtfilt (sin desfase), el estándar en
  # biomecánica.
  tipo: butterworth
  orden: 2
  # 3.4 Hz: mediana del análisis de residuos de Winter sobre este material
  # (rango óptimo 2.0 a 4.25 Hz según el landmark); el piso de ruido de la PSD
  # arranca en ~4 Hz, así que los 6 Hz habituales en biomecánica dejarían pasar
  # ruido.
  frecuencia_corte_hz: 3.4
  # Hueco máximo, en fotogramas, que se interpola linealmente. Los más largos
  # quedan en NaN y cortan el tramo.
  #
  # 3 fotogramas (0.1 s): con la brazada a 0.47 Hz, interpolar 0.5 s equivale a
  # inventar un cuarto de ciclo.
  hueco_maximo_interpolable_fotogramas: 3

segmentacion:
  # DECISIÓN ABIERTA — SIN JUSTIFICAR TODAVÍA.
  # Criterio para dividir la serie en ciclos de brazada por detección de picos.
  #
  # Señal sobre la que se buscan los picos.
  senal: null
  # Distancia mínima entre picos consecutivos, en segundos (> 0).
  distancia_minima_entre_picos_s: null

lateralidad:
  # Qué se hace con los intercambios izquierda/derecha de MediaPipe cuando el
  # cuerpo pasa por posiciones ambiguas.
  #
  # "ninguno": se detectan y se marcan con una bandera en el Parquet filtrado,
  # y se informa la tasa por par, pero no se corrigen. Corregir sin saber si el
  # artefacto llega a la serie de ángulos sería tocar el dato antes de tener
  # evidencia de que hace falta.
  metodo_correccion_intercambios: ninguno
  # Parámetros del detector: entre dos fotogramas seguidos se marca el par
  # cuando intercambiar las etiquetas explica el movimiento con al menos
  # `margen_minimo_px` menos de desplazamiento total.
  margen_minimo_px: 20.0
  # Solo se evalúan pares separados al menos esto en ambos fotogramas: con los
  # dos puntos encimados, cuál es cuál no cambia ninguna medición. En este video
  # la separación mediana va de 7 px (caderas) a 72 px (muñecas).
  separacion_minima_px: 20.0
