# Configuración del pipeline de swimalyzer.
#
# Todos los parámetros son obligatorios: si falta una clave, la carga falla.
# Los que están en `null` son DECISIONES ABIERTAS (ver CLAUDE.md): todavía no
# tienen un valor justificado con evidencia. Se dejan en null a propósito para
# que ningún número provisorio termine en una figura. La etapa que los necesite
# se niega a correr hasta que se completen.
#
# Los valores de `calidad`, `filtrado` y `lateralidad` salieron del informe de
# caracterización de la señal (`scripts/caracterizar_senal.py`) sobre el video
# de desarrollo; el comentario de cada uno dice de dónde.
#
# Las rutas relativas se resuelven respecto de la carpeta de este archivo.

modelo:
  # URL del modelo Pose Landmarker (variante heavy, float16). Se usa la ruta con
  # versión (/1/) y no /latest/, que puede cambiar sin aviso.
  url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task
  # SHA-256 esperado del archivo. Google no lo publica: se calculó sobre la
  # descarga del 2026-09-15 y se verificó contra el MD5 que expone el bucket
  # (header x-goog-hash). Se registra en la metadata de cada corrida.
  sha256: 64437af838a65d18e5ba7a0d39b465540069bc8aae8308de3e318aad31fcbc7b
  # Dónde queda el modelo descargado. La carpeta está ignorada por git.
  ruta: modelos/pose_landmarker_heavy.task

deteccion:
  # Parámetros de PoseLandmarkerOptions. Los valores son los que MediaPipe
  # 1.0.1 usa por defecto; se explicitan para que queden en la metadata. No
  # fueron ajustados para este video.
  #
  # Cantidad máxima de personas a detectar por fotograma. Varios nadadores
  # simultáneos está fuera de alcance.
  num_poses: 1
  # Confianza mínima del detector de persona para aceptar una detección.
  min_pose_detection_confidence: 0.5
  # Confianza mínima de que la pose sigue presente en el fotograma.
  min_pose_presence_confidence: 0.5
  # Confianza mínima para seguir la pose entre fotogramas en lugar de volver a
  # correr el detector.
  min_tracking_confidence: 0.5

video:
  # Recorte aplicado a cada fotograma antes de la inferencia, en píxeles del
  # video original: {x, y, ancho, alto}, con (x, y) la esquina superior
  # izquierda. null = sin recorte. Se puede sobrescribir desde el CLI con
  # --recorte X Y ANCHO ALTO.
  recorte: null

calidad:
  # Umbral de visibility (0 a 1) por debajo del cual una medición se considera
  # poco confiable. Es criterio de REPORTE, no de descarte: la etapa de métricas
  # lo usa para marcar mediciones dudosas e informar cobertura por landmark, y
  # nunca para borrar filas. El filtrado no mira este valor.
  #
  # 0.3: un umbral global no elige qué fotogramas son malos, elige qué miembros
  # existen, porque en vista lateral visibility discrimina lado cercano de lado
  # lejano; borrar esas mediciones destruiría el resultado principal, que es
  # cuantificar cuán poco confiable es el lado lejano.
  umbral_visibility_reporte: 0.3

  # Rango de valores que cada articulación puede tomar, en grados de ángulo
  # incluido (180 = extendido). Es una restricción del cuerpo, no un parámetro
  # ajustable: sale del rango de movimiento articular de referencia en
  # goniometría (AAOS; Norkin & White, "Measurement of Joint Motion: A Guide to
  # Goniometry"), convertido con `incluido = 180 - flexión`.
  #
  # - codo: flexión 0 a 150 grados -> piso en 30.
  # - rodilla: flexión 0 a 135 activa, hasta 150 pasiva; se toma la pasiva, que
  #   es el extremo permisivo -> piso en 30.
  # - hombro (ángulo entre brazo y tronco): flexión 0 a 180 y extensión 0 a 60;
  #   como ángulo incluido no se distingue adelante de atrás, todo el rango es
  #   alcanzable y la restricción queda inerte a propósito. Se declara igual
  #   para que se vea que no se olvidó.
  #
  # Se toma en cada caso el extremo MÁS permisivo del rango de referencia: el
  # criterio tiene que marcar lo imposible, no lo inusual. El máximo de 180 es
  # inerte por construcción, porque un ángulo incluido no puede pasarlo.
  #
  # La clave es el tipo de articulación, no el lado: el rango de movimiento del
  # codo derecho es el mismo que el del izquierdo.
  rango_anatomico_grados:
    codo:
      minimo: 30.0
      maximo: 180.0
    hombro:
      minimo: 0.0
      maximo: 180.0
    rodilla:
      minimo: 30.0
      maximo: 180.0

  # Salto máximo creíble del ángulo entre dos fotogramas consecutivos, en grados
  # por fotograma. Por encima de esto la medición queda marcada.
  #
  # 30 grados por fotograma (900 grados/s a 30 fps). Con la brazada a 0.55 Hz y
  # la excursión de codo medida, una oscilación sinusoidal da un pico de
  # 5.6 grados por fotograma: el umbral está unas 5 veces por encima, margen que
  # cubre que el agarre es más rápido que el promedio del ciclo y que la señal
  # no es una sinusoide. Marca lo grosero.
  #
  # Los 0.55 Hz salen de medir la duración de los ciclos ya segmentados
  # (mediana 1.83 s sobre 7 ciclos). El valor que figuraba antes acá, 0.47 Hz,
  # venía del pico de la PSD del informe de caracterización, que con ventanas
  # de 8 s tiene una resolución de 0.234 Hz: 0.47 era el bin 2, o sea el número
  # no distinguía 0.47 de 0.55. Cambiar la frecuencia no cambia el umbral —30
  # sigue estando muy por encima del pico teórico—, pero el número tiene que
  # ser correcto.
  #
  # Uno solo para las tres articulaciones: la rodilla no necesita uno propio
  # (su p99 es 12 grados por fotograma) y multiplicar parámetros sin evidencia
  # de que hagan falta agrega decisiones que después hay que justificar.
  velocidad_angular_maxima_grados_por_fotograma: 30.0

filtrado:
  # Filtro paso bajo aplicado a las trayectorias, en píxeles, tramo continuo por
  # tramo continuo. Sin gate por visibility: se filtra todo lo detectado.
  #
  # Butterworth de orden 2 con filtfilt (sin desfase), el estándar en
  # biomecánica.
  tipo: butterworth
  orden: 2
  # 3.4 Hz: mediana del análisis de residuos de Winter sobre este material
  # (rango óptimo 2.0 a 4.25 Hz según el landmark); el piso de ruido de la PSD
  # arranca en ~4 Hz, así que los 6 Hz habituales en biomecánica dejarían pasar
  # ruido.
  frecuencia_corte_hz: 3.4
  # Hueco máximo, en fotogramas, que se interpola linealmente. Los más largos
  # quedan en NaN y cortan el tramo.
  #
  # 3 fotogramas (0.1 s): con la brazada a 0.55 Hz, interpolar 0.5 s equivale a
  # inventar más de un cuarto de ciclo.
  hueco_maximo_interpolable_fotogramas: 3

segmentacion:
  # Criterio para dividir la serie en ciclos de brazada por detección de picos.
  # Fijado con el barrido sobre el video de desarrollo (2026-09-18); el informe
  # que lo respalda se regenera con `scripts/informe_ciclos.py`.
  #
  # Señal sobre la que se buscan los máximos. `muneca_y_rel_hombro` es la ALTURA
  # de la muñeca izquierda SOBRE el hombro izquierdo, en píxeles: `y_hombro -
  # y_muñeca`, positiva con la mano arriba. El orden de la resta importa, porque
  # en coordenadas de imagen la `y` crece hacia abajo; al revés el máximo sería
  # la mano más profunda del tirón, que es otro evento y da otros ciclos.
  #
  # Relativa al hombro y no absoluta porque el nadador se desplaza dentro del
  # encuadre, y una coordenada absoluta mezclaría ese desplazamiento con el
  # movimiento del brazo.
  #
  # Por qué la muñeca y no otra: las tres señales posicionales que se midieron
  # (muñeca en x, muñeca en y, codo en y, todas relativas al hombro) empatan
  # dentro del ruido —19.1 a 19.8 grados de desvío entre ciclos de la curva de
  # codo—, así que el desempate no puede ser el decimal. Gana la muñeca porque
  # su máximo corresponde a un evento nombrado de la brazada (la mano en lo más
  # alto del recobro, antes de la entrada al agua), que es el punto de
  # referencia habitual en la literatura: así la fase 0 queda definida en
  # términos biomecánicos y no como el máximo de una señal auxiliar.
  #
  # El ángulo de codo queda descartado con evidencia: da ciclos de 1.40 a
  # 3.07 s, porque la serie vive saturada entre 165 y 180 grados y el detector
  # engancha la meseta en vez de un evento.
  senal: muneca_y_rel_hombro

  # Distancia mínima entre picos consecutivos, en segundos (> 0).
  #
  # 1.4 s: entre 1.2 y 1.6 s el resultado es idéntico —misma cantidad de picos,
  # en las mismas posiciones—, así que es una meseta y no un valor delicado;
  # 1.4 es el centro. Equivale a rechazar ciclos más rápidos que 0.71 Hz cuando
  # la brazada medida va a 0.55 Hz. Por debajo de 1.0 s aparece el máximo
  # secundario de cada ciclo y la cuenta se duplica.
  distancia_minima_entre_picos_s: 1.4

  # No hay parámetro de prominencia mínima a propósito: en el barrido de 0 a
  # 20 px no cambió ningún pico. Un parámetro que no cambia nada igual hay que
  # justificarlo después, así que no se agrega.

lateralidad:
  # Qué se hace con los intercambios izquierda/derecha de MediaPipe cuando el
  # cuerpo pasa por posiciones ambiguas.
  #
  # "ninguno": se detectan y se marcan con una bandera en el Parquet filtrado,
  # y se informa la tasa por par, pero no se corrigen. Corregir sin saber si el
  # artefacto llega a la serie de ángulos sería tocar el dato antes de tener
  # evidencia de que hace falta.
  metodo_correccion_intercambios: ninguno
  # Parámetros del detector: entre dos fotogramas seguidos se marca el par
  # cuando intercambiar las etiquetas explica el movimiento con al menos
  # `margen_minimo_px` menos de desplazamiento total.
  margen_minimo_px: 20.0
  # Solo se evalúan pares separados al menos esto en ambos fotogramas: con los
  # dos puntos encimados, cuál es cuál no cambia ninguna medición. En este video
  # la separación mediana va de 7 px (caderas) a 72 px (muñecas).
  separacion_minima_px: 20.0
